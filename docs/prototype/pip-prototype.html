<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip prototype</title>
<style>
:root{--bg:#f4f3f8;--page:#fff;--ink:#1f1d2b;--muted:#6b6880;--line:#e4e2ec;--chip:#efedf8;
--body:#8B7CF6;--body-dark:#6E5EE0;--body-light:#C9C2FC;--eye:#221A45;--cheek:#F9A8D4;--spark:#FBBF24;--cap:#5B8DEF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121118;--page:#1b1a23;--ink:#ecebf3;--muted:#a19eb5;--line:#2e2c3a;--chip:#262433}}
:root[data-theme="dark"]{--bg:#121118;--page:#1b1a23;--ink:#ecebf3;--muted:#a19eb5;--line:#2e2c3a;--chip:#262433}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:18px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.controls button,.controls select{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--page);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.controls button:hover{border-color:var(--body)}
.controls .lbl{color:var(--muted);font-size:13px;margin-right:2px}

.browser{position:relative;height:540px;background:var(--page);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:4px}
.url{flex:1;background:var(--chip);border-radius:6px;padding:3px 10px;color:var(--muted);font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.content{padding:20px 24px}
.sk{height:10px;background:var(--chip);border-radius:5px;margin:10px 0}
.chatbox{position:absolute;left:24px;right:140px;bottom:20px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--page)}
.chatbox small{color:var(--muted);font-size:11px}
.chatbox textarea{width:100%;border:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:13px;height:58px;outline:none}

/* ---------- Pip ---------- */
.pip-wrap{position:absolute;right:14px;bottom:10px;width:96px;height:96px;cursor:pointer;outline:none;
  transform-origin:100% 100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .45s}
.pip-wrap:focus-visible{outline:2px solid var(--body);outline-offset:4px;border-radius:16px}
.pip-wrap[data-state="sleeping"]{transform:scale(.78) translateY(8px);opacity:.88}
.pip-wrap[data-state="sleeping"]:hover{transform:scale(.82) translateY(6px);opacity:1}
.pip{width:100%;height:100%;overflow:visible}
.pip g{transform-box:view-box}
.skin{fill:var(--body)} .skin-dark{fill:var(--body-dark)}
.shadow{fill:#000;opacity:.12;transform-box:view-box;transform-origin:60px 113px}
.v{opacity:0;transition:opacity .15s}

.hopper,.bob,.squisher{transform-origin:60px 108px}
.look{transform:translate(var(--lx,0px),var(--ly,0px));transition:transform .25s ease-out}
.eyes-open{transform-origin:60px 60px;transition:transform .07s,opacity .15s}
.pip-wrap.blink .eyes-open{transform:scaleY(.1)}
.arm-r{transform-origin:98px 80px}
.arm-l{transform-origin:22px 80px}
.spark{fill:var(--spark);transform-box:fill-box;transform-origin:50% 50%;transition:opacity .4s}
.stem{stroke:var(--body-dark)}
[data-tod="evening"] .spark{fill:#FB923C}
[data-tod="night"] .spark{fill:#A5C4FD}

/* which parts each state shows */
[data-state="sleeping"] .eyes-closed,[data-state="yawning"] .eyes-closed{opacity:1}
[data-state="sleeping"]:hover .eyes-closed{opacity:0}
[data-state="sleeping"]:hover .eyes-peek{opacity:1}
:is([data-state="waking"],[data-state="idle"],[data-state="listening"],[data-state="thinking"],[data-state="hmm"],[data-state="worried"]) .eyes-open{opacity:1}
[data-state="ready"] .eyes-happy{opacity:1}
[data-state="sleeping"] .m-sleep{opacity:1}
:is([data-state="waking"]) .m-o,[data-state="yawning"] .m-yawn{opacity:1}
:is([data-state="idle"],[data-state="listening"]) .m-smile{opacity:1}
[data-state="thinking"] .m-flat{opacity:1}
:is([data-state="hmm"],[data-state="worried"]) .m-wobble{opacity:1}
[data-state="ready"] .m-open{opacity:1}
[data-state="hmm"] .brows-hmm{opacity:1}
[data-state="worried"] .brows-worried{opacity:1}
[data-state="sleeping"] .fx-z{opacity:1}
[data-state="thinking"] .fx-dots{opacity:1}
[data-state="hmm"] .fx-q{opacity:1}
[data-state="ready"] .fx-spark{opacity:1}
[data-tod="night"]:is([data-state="sleeping"],[data-state="yawning"]) .cap{opacity:1}
[data-state="sleeping"] .spark{opacity:.3}
[data-state="sleeping"] .cheeks{opacity:.45}
[data-state="thinking"] .look{transform:translate(3px,-3px)}
[data-state="listening"] .look{transform:translate(calc(var(--lx,0px) - 1px),calc(var(--ly,0px) - 1px))}

/* animations */
[data-state="sleeping"] .bob{animation:breathe 4.8s ease-in-out infinite}
[data-state="sleeping"] .z1{animation:zfloat 6s ease-in-out infinite}
[data-state="sleeping"] .z2{animation:zfloat 6s ease-in-out 3s infinite}
[data-state="waking"] .bob{animation:stretch .7s ease-out}
[data-state="waking"] .arm-r{animation:wave .7s ease-in-out .15s}
[data-state="yawning"] .bob{animation:yawn 1.4s ease-in-out}
[data-state="hmm"] .bob{transform:rotate(-7deg);transition:transform .3s}
[data-state="thinking"] .d1{animation:pulse 1.2s infinite}
[data-state="thinking"] .d2{animation:pulse 1.2s .2s infinite}
[data-state="thinking"] .d3{animation:pulse 1.2s .4s infinite}
[data-state="thinking"] .arm-l{animation:tap .6s ease-in-out infinite alternate}
[data-state="ready"] .hopper{animation:hop .6s ease-out}
[data-state="ready"] .shadow{animation:shrink .6s ease-out}
[data-state="ready"] .star{animation:twinkle 1.1s ease-out both}
[data-state="ready"] .s2{animation-delay:.15s} [data-state="ready"] .s3{animation-delay:.3s}
[data-state="ready"] .spark{animation:glow .9s ease-out}
[data-state="worried"] .hopper{animation:shake .35s ease-in-out 2}
.squisher.squish{animation:squish .35s ease-out}
.star{transform-box:fill-box;transform-origin:50% 50%}

@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.04)}}
@keyframes zfloat{0%{opacity:0;transform:translate(0,4px)}25%{opacity:.75}100%{opacity:0;transform:translate(7px,-10px)}}
@keyframes stretch{0%{transform:scale(1,1)}30%{transform:scale(1.1,.88)}60%{transform:scale(.94,1.1)}100%{transform:scale(1,1)}}
@keyframes wave{0%,100%{transform:rotate(0)}30%{transform:rotate(-35deg)}65%{transform:rotate(10deg)}}
@keyframes yawn{0%,100%{transform:scale(1,1)}45%{transform:scale(.97,1.08)}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes tap{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-12px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
@keyframes shrink{35%{transform:scale(.7)}}
@keyframes twinkle{0%{opacity:0;transform:scale(.2)}45%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(.7) rotate(40deg)}}
@keyframes glow{0%,100%{transform:scale(1)}40%{transform:scale(1.5)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2.5px)}75%{transform:translateX(2.5px)}}
@keyframes squish{0%{transform:scale(1)}35%{transform:scale(1.1,.88)}70%{transform:scale(.96,1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pip *,.pip-wrap{animation:none!important;transition:none!important}}

/* ---------- Panel ---------- */
.panel{position:absolute;right:16px;bottom:112px;width:300px;max-width:calc(100% - 32px);background:var(--page);border:1px solid var(--line);
  border-radius:14px;padding:14px;box-shadow:0 10px 30px rgba(20,10,60,.14);opacity:0;transform:translateY(8px) scale(.98);
  transform-origin:90% 100%;pointer-events:none;transition:opacity .2s,transform .2s}
.panel.open{opacity:1;transform:none;pointer-events:auto}
.panel header{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px}
.panel h2{font-size:15px;font-weight:600;margin:0}
.panel .hint{color:var(--muted);font-size:12px;margin:2px 0 0}
.panel .x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:2px 4px}
.sugs{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.sugs button{text-align:left;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}
.sugs button:hover{border-color:var(--body)}
.sugs .tag{float:right;color:var(--muted);font-size:11px}
.draft{width:100%;font:inherit;font-size:13px;border:1px dashed var(--body);background:transparent;color:var(--ink);border-radius:9px;padding:7px 10px;cursor:pointer}
.status{min-height:20px;margin-top:8px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Pip prototype</h1>
  <p class="sub">Pip sleeps in the corner. Hover to make it stir, click to wake it. Close the panel and it dozes off again after a few seconds.</p>

  <div class="controls">
    <span class="lbl">Preview state:</span>
    <button data-s="sleeping">sleeping</button>
    <button data-s="waking">waking</button>
    <button data-s="idle">idle</button>
    <button data-s="listening">listening</button>
    <button data-s="thinking">thinking</button>
    <button data-s="hmm">vague prompt</button>
    <button data-s="ready">prompt ready</button>
    <button data-s="worried">can't read page</button>
    <button data-s="yawning">yawning</button>
    <span class="lbl" style="margin-left:8px">Time of day:</span>
    <select id="tod" aria-label="Time of day">
      <option value="auto">auto</option><option value="morning">morning</option><option value="day">day</option>
      <option value="evening">evening</option><option value="night">night</option>
    </select>
  </div>

  <div class="browser" id="browser">
    <div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="url">docs.example.dev/api/payments/create</span></div>
    <div class="content">
      <div class="sk" style="width:38%;height:16px"></div>
      <div class="sk" style="width:92%"></div><div class="sk" style="width:84%"></div><div class="sk" style="width:88%"></div>
      <div class="sk" style="width:60%;height:60px;margin-top:18px"></div>
      <div class="sk" style="width:90%"></div><div class="sk" style="width:72%"></div>
    </div>

    <div class="chatbox"><small>AI chat box (some other tab or site)</small>
      <textarea id="chat" aria-label="Chat box">make the payment thing work</textarea></div>

    <div class="panel" id="panel" role="dialog" aria-label="Pip prompt helper">
      <header>
        <div><h2 id="greet">Hi! What are we prompting?</h2><p class="hint">Suggestions for this page</p></div>
        <button class="x" id="close" aria-label="Close">&times;</button>
      </header>
      <div class="sugs">
        <button data-t="api">Integrate this API <span class="tag">docs page</span></button>
        <button data-t="ideas">Mine ideas and references</button>
        <button data-t="aicheck">Check for AI-sounding writing</button>
      </div>
      <button class="draft" id="draft">Improve my draft in the chat box</button>
      <div class="status" id="status" aria-live="polite"></div>
    </div>

    <div class="pip-wrap" id="pip" data-state="sleeping" data-tod="day" role="button" tabindex="0" aria-label="Pip is asleep. Click to wake.">
      <svg class="pip" viewBox="0 0 120 120" aria-hidden="true">
        <ellipse class="shadow" cx="60" cy="113" rx="30" ry="4"/>
        <g class="hopper"><g class="bob"><g class="squisher">
          <g class="arm-l"><ellipse class="skin-dark" cx="20" cy="76" rx="6" ry="8"/></g>
          <g class="arm-r"><ellipse class="skin-dark" cx="100" cy="76" rx="6" ry="8"/></g>
          <path class="skin-dark" d="M44 96 L33 110 L60 98 Z"/>
          <rect class="skin" x="18" y="30" width="84" height="68" rx="30"/>
          <path d="M18 74 Q18 98 48 98 L72 98 Q102 98 102 74 Q60 90 18 74 Z" fill="var(--body-dark)" opacity=".35"/>
          <ellipse cx="38" cy="44" rx="9" ry="4.5" fill="#fff" opacity=".28" transform="rotate(-28 38 44)"/>
          <path class="stem" d="M60 31 Q57 21 64 14" fill="none" stroke-width="3" stroke-linecap="round"/>
          <path class="spark" d="M65 5 L67 10 L72 12 L67 14 L65 19 L63 14 L58 12 L63 10 Z"/>

          <g class="cheeks"><ellipse cx="36" cy="72" rx="5.5" ry="3.2" fill="var(--cheek)" opacity=".75"/><ellipse cx="84" cy="72" rx="5.5" ry="3.2" fill="var(--cheek)" opacity=".75"/></g>
          <g class="look">
            <g class="v eyes-open">
              <ellipse cx="46" cy="60" rx="5.5" ry="7" fill="var(--eye)"/><circle cx="48" cy="57" r="2" fill="#fff"/>
              <ellipse cx="74" cy="60" rx="5.5" ry="7" fill="var(--eye)"/><circle cx="76" cy="57" r="2" fill="#fff"/>
            </g>
            <g class="v eyes-closed" fill="none" stroke="var(--eye)" stroke-width="3" stroke-linecap="round">
              <path d="M40 61 Q46 66 52 61"/><path d="M68 61 Q74 66 80 61"/>
            </g>
            <g class="v eyes-peek">
              <ellipse cx="46" cy="61" rx="4.5" ry="3.5" fill="var(--eye)"/>
              <path d="M68 61 Q74 66 80 61" fill="none" stroke="var(--eye)" stroke-width="3" stroke-linecap="round"/>
            </g>
            <g class="v eyes-happy" fill="none" stroke="var(--eye)" stroke-width="3" stroke-linecap="round">
              <path d="M40 63 Q46 54 52 63"/><path d="M68 63 Q74 54 80 63"/>
            </g>
            <g class="v brows-hmm" fill="none" stroke="var(--eye)" stroke-width="2.5" stroke-linecap="round">
              <path d="M40 50 L51 50"/><path d="M68 47 Q74 42 80 46"/>
            </g>
            <g class="v brows-worried" fill="none" stroke="var(--eye)" stroke-width="2.5" stroke-linecap="round">
              <path d="M41 50 L51 46"/><path d="M69 46 L79 50"/>
            </g>
            <path class="v m-smile" d="M54 74 Q60 79 66 74" fill="none" stroke="var(--eye)" stroke-width="2.6" stroke-linecap="round"/>
            <path class="v m-sleep" d="M57 76 Q60 78 63 76" fill="none" stroke="var(--eye)" stroke-width="2.4" stroke-linecap="round"/>
            <path class="v m-flat" d="M56 76 L64 76" fill="none" stroke="var(--eye)" stroke-width="2.6" stroke-linecap="round"/>
            <path class="v m-wobble" d="M53 76 q3.5 -3 7 0 q3.5 3 7 0" fill="none" stroke="var(--eye)" stroke-width="2.4" stroke-linecap="round"/>
            <path class="v m-open" d="M53 73 Q60 84 67 73 Z" fill="var(--eye)"/>
            <ellipse class="v m-o" cx="60" cy="76" rx="3.5" ry="4" fill="var(--eye)"/>
            <ellipse class="v m-yawn" cx="60" cy="77" rx="5" ry="6.5" fill="var(--eye)"/>
          </g>

          <g class="v cap">
            <path d="M66 36 Q84 14 108 22 Q98 28 94 42 Z" fill="var(--cap)"/>
            <path d="M64 37 Q80 30 95 42" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
            <circle cx="109" cy="22" r="4.5" fill="#fff"/>
          </g>
        </g></g></g>

        <g class="v fx-z" fill="var(--body-dark)" font-family="system-ui,sans-serif" font-weight="700">
          <text class="z1" x="92" y="28" font-size="12">z</text><text class="z2" x="100" y="16" font-size="9">z</text>
        </g>
        <g class="v fx-dots" fill="var(--body-light)">
          <circle class="d1" cx="88" cy="24" r="2.5"/><circle class="d2" cx="96" cy="16" r="3.5"/><circle class="d3" cx="106" cy="8" r="4.5"/>
        </g>
        <text class="v fx-q" x="98" y="26" font-size="18" font-weight="700" fill="var(--body-dark)" font-family="system-ui,sans-serif">?</text>
        <g class="v fx-spark" fill="var(--spark)">
          <g transform="translate(12 34)"><path class="star" d="M0 -6 L1.6 -1.6 L6 0 L1.6 1.6 L0 6 L-1.6 1.6 L-6 0 L-1.6 -1.6 Z"/></g>
          <g transform="translate(106 30)"><path class="star s2" d="M0 -5 L1.3 -1.3 L5 0 L1.3 1.3 L0 5 L-1.3 1.3 L-5 0 L-1.3 -1.3 Z"/></g>
          <g transform="translate(110 58)"><path class="star s3" d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/></g>
        </g>
      </svg>
    </div>
  </div>
</div>

<script>
const pip = document.getElementById('pip');
const panel = document.getElementById('panel');
const status = document.getElementById('status');
const chat = document.getElementById('chat');
const greet = document.getElementById('greet');
const todSel = document.getElementById('tod');
const IDLE_BEFORE_SLEEP = 6000; // demo value; the product would use ~30s
const AWAKE = ['idle', 'listening', 'thinking', 'hmm', 'ready', 'worried'];
const PROMPTS = {
  api: 'I want to integrate the API documented at docs.example.dev/api/payments/create so that…\n\nUse only endpoints in these docs. Keep credentials in env vars…',
  ideas: "I'm working on… Read the content below and pull out what's useful for my project…",
  aicheck: 'Review the text below for passages that read as AI-generated or generic…'
};

let timers = [];
const later = (fn, ms) => timers.push(setTimeout(fn, ms));
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

function setState(s) {
  pip.dataset.state = '';
  void pip.getBoundingClientRect(); // restart animations when re-entering a state
  pip.dataset.state = s;
  pip.setAttribute('aria-label', s === 'sleeping' ? 'Pip is asleep. Click to wake.' : 'Pip, your prompt helper');
}

function goToSleepLater(ms = IDLE_BEFORE_SLEEP) {
  later(() => { setState('yawning'); later(() => setState('sleeping'), 1400); }, ms);
}

function squish() {
  const s = pip.querySelector('.squisher');
  s.classList.remove('squish');
  void s.getBoundingClientRect();
  s.classList.add('squish');
}

function openPanel() { status.textContent = ''; panel.classList.add('open'); }
function closePanel() { panel.classList.remove('open'); clearTimers(); setState('idle'); goToSleepLater(); }

function wake() {
  clearTimers();
  setState('waking');
  later(() => { setState('listening'); openPanel(); }, 750);
}

function onPipClick() {
  const s = pip.dataset.state;
  if (s === 'sleeping' || s === 'yawning') return wake();
  squish();
  if (panel.classList.contains('open')) return closePanel();
  clearTimers(); setState('listening'); openPanel();
}

pip.addEventListener('click', onPipClick);
pip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPipClick(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('open')) closePanel(); });
document.getElementById('close').addEventListener('click', closePanel);

document.querySelectorAll('.sugs button').forEach(b => b.addEventListener('click', () => {
  clearTimers();
  setState('thinking');
  status.textContent = 'Reading the page and filling the template…';
  later(() => {
    setState('ready');
    chat.value = PROMPTS[b.dataset.t];
    status.textContent = 'Prompt placed in the chat box. Review it, then press Enter yourself.';
    later(() => setState('listening'), 2200);
  }, 1600);
}));

document.getElementById('draft').addEventListener('click', () => {
  clearTimers();
  setState('thinking');
  status.textContent = 'Checking your draft…';
  later(() => {
    setState('hmm');
    status.textContent = 'Your draft has no goal, context or output format. Pick a template above, or tell me what you are building.';
  }, 1200);
});

document.querySelectorAll('.controls [data-s]').forEach(b => b.addEventListener('click', () => {
  clearTimers();
  setState(b.dataset.s);
}));

// Blink now and then while awake.
(function blinkLoop() {
  setTimeout(() => {
    if (AWAKE.includes(pip.dataset.state)) {
      pip.classList.add('blink');
      setTimeout(() => pip.classList.remove('blink'), 140);
    }
    blinkLoop();
  }, 2500 + Math.random() * 3500);
})();

// Eyes follow the cursor a little while awake. Never while asleep.
document.getElementById('browser').addEventListener('mousemove', e => {
  if (!['idle', 'listening'].includes(pip.dataset.state)) return;
  const r = pip.getBoundingClientRect();
  const clamp = v => Math.max(-1, Math.min(1, v));
  pip.style.setProperty('--lx', clamp((e.clientX - (r.left + r.width / 2)) / 200) * 2.5 + 'px');
  pip.style.setProperty('--ly', clamp((e.clientY - (r.top + r.height / 2)) / 200) * 2.5 + 'px');
});

const GREETINGS = { morning: 'Morning! What are we prompting?', day: 'Hi! What are we prompting?',
  evening: 'Evening! What are we prompting?', night: 'Late one, huh? What are we prompting?' };
function applyTod() {
  let t = todSel.value;
  if (t === 'auto') {
    const h = new Date().getHours();
    t = h < 5 ? 'night' : h < 12 ? 'morning' : h < 17 ? 'day' : h < 21 ? 'evening' : 'night';
  }
  pip.dataset.tod = t;
  greet.textContent = GREETINGS[t];
}
todSel.addEventListener('change', applyTod);
applyTod();
</script>
</body>
</html>
